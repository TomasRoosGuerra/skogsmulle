[build]
  publish = "."
  command = "npm run build"

# Global headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "index, follow"
    # Content-Security-Policy i Report-Only-läge för testning (cdn.jsdelivr.net = DOMPurify, se tests/csp.test.js)
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://cdn.jsdelivr.net; connect-src 'self' https://firestore.googleapis.com https://*.googleapis.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# HTML-sidor
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/stories/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Media med versionerade namn kan cachas länge
[[headers]]
  for = "/intro-720p.*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/share-image.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/intro-poster.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Övriga mediafiler
[[headers]]
  for = "*.mp3"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.webm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.wav"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sitemap och robots
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=86400"

# Redirect story pages that don't exist back to main page with anchor
[[redirects]]
  from = "/stories/*"
  to = "/#stories"
  status = 302

# Extensionslös länk till integritetssidan (statisk fil, ingen SPA-väg)
[[redirects]]
  from = "/integritet"
  to = "/integritet.html"
  status = 200

# OBS: ingen catch-all "/* -> /index.html 200" längre. Appen använder hash-routing
# (#story-<id>, #login, #stories) på "/", inga SPA-vägar. Okända adresser får därför
# en riktig 404 med /404.html (Netlify serverar den automatiskt med status 404).
